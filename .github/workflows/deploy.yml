name: Build and deploy API

on:
  workflow_dispatch:
  push:
    tags: ["api-v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/tourvex-api:${{ github.sha }}
      - name: Pull and restart on DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /opt/tourvex/api
            export TOURVEX_API_IMAGE=registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/tourvex-api:${{ github.sha }}
            docker login registry.digitalocean.com -u '${{ secrets.DO_REGISTRY_TOKEN }}' -p '${{ secrets.DO_REGISTRY_TOKEN }}'
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d --remove-orphans api
