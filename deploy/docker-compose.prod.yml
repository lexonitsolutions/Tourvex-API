name: tourvex-production

services:
  api:
    image: ${TOURVEX_API_IMAGE}
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
